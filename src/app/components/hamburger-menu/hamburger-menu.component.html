<div class="relative">
    <!-- Menu Button -->
    <button
        (click)="toggleMenu()"
        class="p-2 text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition-colors"
        [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="isMenuOpen()"
    >
        <lucide-angular
            [img]="isMenuOpen() ? closeIcon : menuIcon"
            [size]="20"
        ></lucide-angular>
    </button>

    <!-- Menu Dropdown -->
    @if (isMenuOpen()) {
        <div
            class="absolute right-0 top-full mt-2 w-64 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-50"
        >
            <!-- Menu Header -->
            <div
                class="px-4 py-3 border-b border-gray-200 dark:border-gray-700"
            >
                <div class="flex items-center gap-2">
                    <lucide-angular
                        [img]="settingsIcon"
                        [size]="16"
                    ></lucide-angular>
                    <h3
                        class="text-sm font-medium text-gray-800 dark:text-gray-200"
                    >
                        Display Settings
                    </h3>
                </div>
            </div>

            <!-- Menu Items -->
            <div class="py-2">
                <!-- Dark Mode Toggle -->
                <button
                    (click)="toggleDarkMode()"
                    class="w-full px-4 py-2 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
                >
                    <div class="flex items-center gap-3">
                        <lucide-angular
                            [img]="
                                settings().darkMode ? moonIcon : sunIcon
                            "
                            [size]="16"
                            class="text-gray-500 dark:text-gray-400"
                        ></lucide-angular>
                        <span
                            class="text-sm text-gray-700 dark:text-gray-300"
                        >
                            {{
                                settings().darkMode
                                    ? "Dark Mode"
                                    : "Light Mode"
                            }}
                        </span>
                    </div>
                    <div class="relative">
                        <input
                            type="checkbox"
                            [checked]="settings().darkMode"
                            readonly
                            class="sr-only"
                        />
                        <div
                            class="w-10 h-6 bg-gray-200 dark:bg-gray-600 rounded-full relative transition-colors"
                            [class.bg-blue-600]="settings().darkMode"
                        >
                            <div
                                class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"
                                [class.translate-x-4]="
                                    settings().darkMode
                                "
                            ></div>
                        </div>
                    </div>
                </button>

                <!-- Progress Indicator Toggle -->
                <button
                    (click)="toggleProgressIndicator()"
                    class="w-full px-4 py-2 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
                >
                    <div class="flex items-center gap-3">
                        <lucide-angular
                            [img]="chartIcon"
                            [size]="16"
                            class="text-gray-500 dark:text-gray-400"
                        ></lucide-angular>
                        <span
                            class="text-sm text-gray-700 dark:text-gray-300"
                        >
                            Reading Progress
                        </span>
                    </div>
                    <div class="relative">
                        <input
                            type="checkbox"
                            [checked]="settings().showProgressIndicator"
                            readonly
                            class="sr-only"
                        />
                        <div
                            class="w-10 h-6 bg-gray-200 dark:bg-gray-600 rounded-full relative transition-colors"
                            [class.bg-blue-600]="
                                settings().showProgressIndicator
                            "
                        >
                            <div
                                class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"
                                [class.translate-x-4]="
                                    settings().showProgressIndicator
                                "
                            ></div>
                        </div>
                    </div>
                </button>

                <!-- Translation Slider Toggle -->
                <button
                    (click)="toggleTranslationSlider()"
                    class="w-full px-4 py-2 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
                >
                    <div class="flex items-center gap-3">
                        <lucide-angular
                            [img]="slidersIcon"
                            [size]="16"
                            class="text-gray-500 dark:text-gray-400"
                        ></lucide-angular>
                        <span
                            class="text-sm text-gray-700 dark:text-gray-300"
                        >
                            Translation Slider
                        </span>
                    </div>
                    <div class="relative">
                        <input
                            type="checkbox"
                            [checked]="settings().showTranslationSlider"
                            readonly
                            class="sr-only"
                        />
                        <div
                            class="w-10 h-6 bg-gray-200 dark:bg-gray-600 rounded-full relative transition-colors"
                            [class.bg-blue-600]="
                                settings().showTranslationSlider
                            "
                        >
                            <div
                                class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"
                                [class.translate-x-4]="
                                    settings().showTranslationSlider
                                "
                            ></div>
                        </div>
                    </div>
                </button>

                <!-- Show Translation Toggle -->
                <button
                    (click)="toggleShowTranslation()"
                    class="w-full px-4 py-2 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
                >
                    <div class="flex items-center gap-3">
                        <lucide-angular
                            [img]="languagesIcon"
                            [size]="16"
                            class="text-gray-500 dark:text-gray-400"
                        ></lucide-angular>
                        <span
                            class="text-sm text-gray-700 dark:text-gray-300"
                        >
                            Show Translation
                        </span>
                    </div>
                    <div class="relative">
                        <input
                            type="checkbox"
                            [checked]="settings().showTranslation"
                            readonly
                            class="sr-only"
                        />
                        <div
                            class="w-10 h-6 bg-gray-200 dark:bg-gray-600 rounded-full relative transition-colors"
                            [class.bg-blue-600]="
                                settings().showTranslation
                            "
                        >
                            <div
                                class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"
                                [class.translate-x-4]="
                                    settings().showTranslation
                                "
                            ></div>
                        </div>
                    </div>
                </button>

                <!-- Divider -->
                <div class="border-t border-gray-200 dark:border-gray-700 my-2"></div>

                <!-- Native Language Selector -->
                <div class="px-4 py-2">
                    <label for="native-language" class="text-xs font-medium text-gray-500 dark:text-gray-400 block mb-2">
                        Native Language
                    </label>
                    <select
                        id="native-language"
                        [value]="settings().nativeLanguage"
                        (change)="onNativeLanguageChange($event)"
                        class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-md text-gray-700 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <option value="en">English</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>

                <!-- Sentences Per Page -->
                <div class="px-4 py-2">
                    <label for="sentences-per-page" class="text-xs font-medium text-gray-500 dark:text-gray-400 block mb-2">
                        Sentences Per Page: {{ settings().sentencesPerPage }}
                    </label>
                    <input
                        id="sentences-per-page"
                        type="range"
                        min="4"
                        max="16"
                        step="2"
                        [value]="settings().sentencesPerPage"
                        (input)="onSentencesPerPageChange($event)"
                        class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-600"
                    />
                    <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400 mt-1">
                        <span>4</span>
                        <span>16</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Backdrop -->
        <div class="fixed inset-0 z-40" (click)="closeMenu()" tabindex="-1" aria-hidden="true"></div>
    }
</div>
